# 서버에 올릴 때 이 파일 하나로 뜹니다.
#
# 근거: spec/common/08-14-pii-boundary.md — **이 구간에는 원문이 흐릅니다**
#
# ## 왜 앞에 Caddy 를 세우나 — 암호화가 선택이 아닙니다
#
# 앱이 받아 가는 것은 **전사 결과 전문**입니다. 아직 토큰으로 안 바뀐,
# 계좌번호와 이름이 그대로 있는 글입니다. 이걸 인터넷으로 암호화 없이
# 보내면 이 프로젝트가 지키기로 한 경계가 첫 구간에서 무너집니다.
#
# Caddy 를 쓰는 이유는 인증서를 저절로 받아 오고 갱신하기 때문입니다.
# 사람이 관리할 것이 없습니다.
services:
  transcriber:
    build:
      context: .
    restart: always
    # ⚠️ **밖으로 열지 않습니다.** Caddy 만 이 서비스에 닿습니다.
    # 여기서 ports 로 열면 암호화를 우회하는 길이 생깁니다
    expose:
      - "8917"
    environment:
      FINALLY_ENGINE: local
      FINALLY_DEVICE: cpu
      FINALLY_STT: ${FINALLY_STT:-medium}
      FINALLY_COMPUTE: int8
      # 앱만 부를 수 있게 하는 공유 비밀. **비면 아무나 부를 수 있습니다**
      FINALLY_TOKEN: ${FINALLY_TOKEN:?FINALLY_TOKEN 을 .env 에 넣으세요}
      # 첫 사용자가 모델 적재 20초를 안 맞게
      FINALLY_WARMUP: "1"
      # ── 이름 찾기(2차) ────────────────────────────────────────
      # ⚠️ **Ollama 는 이 컴포즈 밖, 호스트에 있습니다.** 컨테이너 안의
      # `127.0.0.1` 은 컨테이너 자신이라 기본값으로는 절대 안 닿습니다 —
      # 2026-08-31 에 이 줄이 없어 `/ner` 이 `ner_unreachable` 이었습니다.
      #
      # 모델이 3.3GB 라 이미지에 넣지 않고 호스트에서 돌립니다. 설치는
      # `curl -fsSL https://ollama.com/install.sh | sh` 한 줄이고 systemd 가 봅니다.
      FINALLY_OLLAMA: ${FINALLY_OLLAMA:-http://host.docker.internal:11434}
      FINALLY_NER: ${FINALLY_NER:-gemma3:4b}
      # ⛔ **`-1`(안 내림)을 바꾸지 마세요.** 내려갔다 올라오는 데 CPU 에서
      # **62초**가 걸립니다(2026-08-31 · 2코어 ARM 실측). 앱은 12초에 끊고,
      # 못 가리면 **사건 진행이 멈춥니다**. 따뜻할 때는 2.9~4.5초입니다
      FINALLY_NER_KEEPALIVE: ${FINALLY_NER_KEEPALIVE:--1}
    # 위 `host.docker.internal` 이 호스트를 가리키게 합니다 (리눅스에서는 기본이 아닙니다)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 모델 파일 1.5GB. 이미지를 다시 만들어도 다시 안 받습니다
      - models:/models
    # 모델 둘이 2.3GB 를 붙듭니다. 4GB 짜리 서버에서 이 상한이 없으면
    # 서비스가 커널에 죽고 왜 죽었는지 안 남습니다
    mem_limit: ${MEM_LIMIT:-3g}

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TRANSCRIBER_DOMAIN: ${TRANSCRIBER_DOMAIN:?도메인을 .env 에 넣으세요}
    depends_on:
      - transcriber

volumes:
  models:
  caddy_data:
  caddy_config:
