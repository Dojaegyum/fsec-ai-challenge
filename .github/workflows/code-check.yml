name: code-check

# 도메인 모듈의 타입과 테스트를 봅니다.
# 사람이 손으로 돌리는 명령과 CI 가 같아야 게이트가 문지기가 아니라 안전망이 됩니다.
#   cd src && npm run typecheck && npm test && npm run build
#
# typecheck 가 `next typegen` 을 먼저 돌립니다. Next 16 은 LayoutProps·PageProps 같은
# 전역 타입을 .next/types/ 에 생성해서 주므로, 그걸 건너뛰면 tsc 가 없는 이름을
# 찾으며 터집니다 — 로컬은 .next 가 남아 있어 통과하고 CI 만 깨졌습니다.
# 근거: RFC-001 「CI가 강제합니다」
#
# lint 도 봅니다 (2026-09-07 부터). 「Windows 에서 응답하지 않는다」던 것은 그냥 느린
# 것이었습니다 — 1분 54초에 끝나고 결과를 냅니다. 그동안 오류 1건(effect 안 setState)이
# 아무 데서도 안 걸린 채 main 에 있었습니다.
on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/code-check.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/code-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      # 경고는 통과시키고 오류만 막습니다 — eslint 의 기본 종료 코드가 그렇습니다
      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      # 빌드만 잡아내는 것이 있습니다 — `client-only`·`server-only` 표식은
      # 시험 실행기에서 빈 구현으로 갈아 끼워지므로(`vitest.config.mts` 참고),
      # **층 경계 위반은 여기서만 걸립니다.** 라우트의 Next 타입 검사도 같습니다.
      #
      # 환경변수 없이 돕니다 — `lib/env.ts` 가 빠진 값을 던지지 않고 목록으로 모읍니다.
      - name: 빌드
        run: npm run build
