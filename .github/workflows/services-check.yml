name: services-check

# `services/` 안의 시험을 돌립니다. `code-check` 는 `src/` 만 보고 언어가 달라
# 이 폴더를 안 봤는데, 그 틈에서 접수 멱등성이 조용히 깨져 있었습니다 —
# 같은 증거로 다시 부르면 모델을 두 번 돌리고 있었습니다.
#
# 사람이 손으로 돌리는 명령과 같습니다:
#   python -m unittest discover -s services/transcriber -t .
#
# ⚠️ **의존성을 설치하지 않습니다.** 시험 대상이 표준 라이브러리만 쓰는 자리라
#    그대로 돕니다. 모델을 부르는 자리를 시험하려면 그때 설치 단계를 더합니다 —
#    지금 넣으면 매 PR 마다 몇 분씩 무거워지는데 돌릴 시험이 없습니다.
# 근거: RFC-001 「CI가 강제합니다」 · ADR-028
on:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/services-check.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/services-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 서비스 시험
        run: python -m unittest discover -s services/transcriber -t . -v
