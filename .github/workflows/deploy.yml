name: deploy

# `main` 에 머지되면 Vercel Production 에 올립니다.
# 사람이 손으로 돌리던 명령과 같습니다 — `deploy/README.md` 「올리는 방법」:
#   cd src && npx vercel deploy --prod --yes
#
# 올리기 전에 `code-check` 와 같은 검사(typecheck · test)를 다시 돕니다.
# 이 저장소는 브랜치 보호가 없어서(Free 플랜) 검사가 빨간 PR 도 머지될 수 있습니다 —
# 그래서 게이트를 배포 잡 안에 둡니다. 빌드는 Vercel 이 합니다 — `next build` 가
# 거기서 돌고, 실패하면 **이전 배포가 그대로 남습니다.**
#
# 근거: ADR-053 · RFC-001 「CI가 강제합니다」 · deploy/README.md
#
# 시크릿 셋이 필요합니다 (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        Vercel → Account Settings → Tokens. **사람이 만들어 넣습니다**
#   VERCEL_ORG_ID       src/.vercel/project.json 의 orgId
#   VERCEL_PROJECT_ID   src/.vercel/project.json 의 projectId
#
# ⚠️ PR 미리보기(Preview)는 일부러 안 만듭니다 — `service_role` 키가 미리보기
#    주소로 열립니다 (deploy/README.md §1). 올라가는 것은 `main` 뿐입니다.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/deploy.yml"
  # 환경변수만 바꿨거나(`KB_VERSION` 등) 같은 커밋을 다시 올려야 할 때 —
  # Actions 탭 → deploy → Run workflow
  workflow_dispatch:

# 머지 둘이 겹쳐도 순서대로 올립니다. 뒤엣것을 취소하면 마지막 커밋이 안 올라갑니다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # 검사를 다 돌고 나서 시크릿이 없다고 터지면 몇 분을 버립니다 — 먼저 봅니다.
      - name: 시크릿이 있는지
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::시크릿이 없습니다:$missing — deploy/README.md 「올리는 방법」을 보세요"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      # `VERCEL_ORG_ID`·`VERCEL_PROJECT_ID` 가 있으면 CLI 는 `vercel link` 없이 그 프로젝트로 갑니다.
      # 소스를 올리고 Vercel 이 빌드합니다 — 손으로 올릴 때와 같은 경로라 결과가 같습니다.
      - name: Vercel Production 에 올리기
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@59 deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "올라간 주소: $url"
          {
            echo "### 배포됨"
            echo
            echo "- 커밋: \`${GITHUB_SHA::7}\`"
            echo "- 배포 주소: $url"
            echo "- 여는 주소는 \`https://fin-ally-khaki.vercel.app\` 입니다 — 다른 별칭은 인증 보호에 걸립니다 (deploy/README.md)"
          } >> "$GITHUB_STEP_SUMMARY"
